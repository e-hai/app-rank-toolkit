name: Build & deploy AppRank Toolkit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apprank-toolkit-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Refresh public ranking snapshot
        run: python3 src/refresh_data.py --out data/snapshot.json

      - name: Run offline tests
        run: python3 -m unittest discover -s src -p 'test_*.py' -v

      - name: Build static toolkit
        run: python3 src/generate.py --out site
        env:
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL || 'https://apprank-toolkit.pages.dev' }}
          CF_WA_TOKEN: ${{ secrets.CF_WA_TOKEN }}

      - name: Sanity check
        run: |
          test -f site/sitemap.xml || { echo "no sitemap"; exit 1; }
          n=$(grep -c '<loc>' site/sitemap.xml)
          echo "URLs: $n"
          test "$n" -ge 30 || { echo "too few URLs"; exit 1; }
          if grep -rl 'example.com' site --include=*.html | grep -q .; then
            echo "ERROR: placeholder domain found"; exit 1
          fi
          if grep -rl 'FAQPage' site --include=*.html | grep -q .; then
            echo "ERROR: FAQPage schema found"; exit 1
          fi
          echo "hreflang pages: $(grep -rl 'rel="alternate"' site --include=*.html | wc -l)"

      - name: Inject GSC verification file (optional)
        run: |
          python3 - <<'PY'
          import os, pathlib
          name = os.environ.get("GSC_VERIFY_FILE", "").strip()
          content = os.environ.get("GSC_VERIFY_CONTENT", "").strip()
          if name and content and "/" not in name and "\\" not in name and ".." not in name:
              (pathlib.Path("site") / name).write_text(content, encoding="utf-8")
              print(f"[i] GSC verification file written: {name}")
          else:
              print("[i] GSC verification not configured, skip")
          PY
        env:
          GSC_VERIFY_FILE: ${{ secrets.GSC_VERIFY_FILE }}
          GSC_VERIFY_CONTENT: ${{ secrets.GSC_VERIFY_CONTENT }}

      - name: Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 先查再建：项目已存在时 create 必然报 8000002，之前靠 continue-on-error
          # 吞掉，每次运行都留一条红色标注。
          code=$(curl -s -o /tmp/pages-project.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/apprank-toolkit")
          if [ "$code" = "200" ]; then
            echo "[i] Pages project apprank-toolkit exists, nothing to do"
            exit 0
          fi
          echo "[i] Pages project not found (HTTP $code), creating it"
          npx --yes wrangler@4 pages project create apprank-toolkit --production-branch main

      - name: Write IndexNow key file
        run: |
          key="${{ secrets.INDEXNOW_KEY }}"
          if [ -z "$key" ]; then echo "[i] INDEXNOW_KEY not set, skip key file"; exit 0; fi
          printf '%s' "$key" > "site/${key}.txt"
          echo "[i] wrote site/${key}.txt"
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=apprank-toolkit --branch=main

      # 部署后把 sitemap 里的 URL 提交给 IndexNow（Bing / Yandex / Seznam / Naver 共用）。
      # 失败不影响部署，输出保留在日志里便于排查。
      - name: Submit URLs to IndexNow
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, os, re, sys, urllib.request, urllib.error
          from urllib.parse import urlparse

          key = os.environ.get("INDEXNOW_KEY", "").strip()
          if not key:
              print("[i] INDEXNOW_KEY not set, skip IndexNow")
              sys.exit(0)

          xml = open("site/sitemap.xml", encoding="utf-8").read()
          urls = re.findall(r"<loc>(.*?)</loc>", xml)[:10000]
          if not urls:
              print("[i] no URLs in sitemap, skip")
              sys.exit(0)

          host = urlparse(urls[0]).netloc
          payload = {"host": host, "key": key,
                     "keyLocation": f"https://{host}/{key}.txt", "urlList": urls}
          req = urllib.request.Request("https://api.indexnow.org/indexnow",
                                       data=json.dumps(payload).encode(),
                                       headers={"Content-Type": "application/json; charset=utf-8",
                                                "User-Agent": "apprank-studio/1.0"})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  print(f"[i] IndexNow {r.status} for {len(urls)} URLs on {host}")
          except urllib.error.HTTPError as e:
              print(f"[!] IndexNow HTTP {e.code}: {e.read()[:200]}")
          sys.exit(0)
          PY
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
